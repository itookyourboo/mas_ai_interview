[project]
name = "mas-ai-interview"
version = "0.1.0"
description = "Мультиагентная система для проведения AI-собеседований"
requires-python = ">=3.13"
dependencies = [
    "langchain-gigachat>=0.3.12",
    "langchain-openai>=0.3.35",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.0.1",
    "chromadb>=0.5.5",
    "transformers>=4.40.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.40.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "nest-asyncio>=1.6.0",
]

[project.scripts]
interview-app = "src.app:main"
build-rag-index = "src.rag.build_index:main"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
